<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact or partner with Matsapha Roses Football Club in Matsapha, Eswatini.">
  <title>Contact & Partnership | Matsapha Roses FC</title>
  <link rel="icon" href="public/assets/brand/matsapha-roses-logo.jpeg">
  <link rel="stylesheet" href="public/styles/site.css">
</head>
<body data-page="contact" data-base=".">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div data-site-header></div>
  <main id="main-content">
    <section class="contact-layout">
      <div class="contact-panel">
        <p class="eyebrow eyebrow-light">Join the movement</p>
        <h1>Let's write the next chapter.</h1>
        <p>Connect with Matsapha Roses Football Club about partnerships, media, fixtures, programmes, player information, or general enquiries.</p>
        <div class="contact-list">
          <a href="tel:+26876296932"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-4-2-2 2c-3.5-1.5-6.5-4.5-8-8l2-2-2-4Z"/></svg> +268 7629 6932</a>
          <a href="mailto:admin@matsapharosesfc.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg> admin@matsapharosesfc.com</a>
          <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg> Matsapha, Eswatini</span>
        </div>
      </div>
      <div class="contact-form-wrap" id="partner">
        <form class="contact-form" data-contact-form action="https://formsubmit.co/admin@matsapharosesfc.com" method="POST">
          <input type="hidden" name="_subject" value="Website enquiry from Matsapha Roses FC">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="false">
          <input type="text" name="_honey" tabindex="-1" autocomplete="off" class="honey-field" aria-hidden="true">
          <div class="form-heading"><p class="card-kicker">Send an enquiry</p><h2>How can we help?</h2></div>
          <div class="form-grid">
            <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
            <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
            <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div>
            <div class="field"><label for="subject">Enquiry type</label><select id="subject" name="subject" required><option value="">Choose one</option><option>Partnership</option><option>Team information</option><option>Fixtures and events</option><option>Media</option><option>General enquiry</option><option>Other</option></select></div>
            <div class="field field-wide"><label for="message">Message</label><textarea id="message" name="message" required placeholder="Tell us how you would like to connect…"></textarea></div>
          </div>
          <button class="button button-dark" type="submit">Send enquiry</button>
          <p class="form-status" data-form-status hidden aria-live="polite"></p>
        </form>
      </div>
    </section>

   
  </main>
  <div data-site-footer></div>
  <script src="public/scripts/data.js"></script>
ve  <script src="public/scripts/common.js"></script>
  <script src="public/scripts/contact.js"></script>
</body>
</html>
